<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c10" id="meta-theme-color" />
    <!-- Reads stored preference before first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tp-theme") || "dark";
          document.documentElement.setAttribute("data-theme", t);
          var tc = t === "light" ? "#f0f2f7" : "#0b0c10";
          document.getElementById("meta-theme-color").content = tc;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta
      name="description"
      content="TalentPulse — bias-audited candidate ranking, attrition risk with counterfactual interventions, and learning paths."
    />
    <title>TalentPulse</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Archivo    — display type, geometric and tight, the product's structural voice.
      Fraunces   — a curvy, high-contrast serif with a real italic. Used for exactly
                   one accent word per major heading, never for a whole sentence —
                   that restraint is what keeps it feeling considered rather than
                   decorative.
      IBM Plex Sans/Mono — reading and every numeral.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
